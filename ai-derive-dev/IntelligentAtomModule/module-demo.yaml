module_id: "user_login"
name: "用户登录"
# 1. 我能做什么？定义请求模板和输入语义
request:
  method: "POST"
  url: "https://api.example.com/login"
  headers:
    Content-Type: "application/json"
  body:
    username: "${username}"
    password: "${password}"
inputs:
  - name: "username"
  - name: "password"
# 2. 我会输出什么？定义输出数据结构和提取路径
outputs:
  - name: "token"
    selector: "$.data.access_token"
# 3. 智能推理指令（增强版）
intelligence_logic: |
  1. 寻找输入：请根据上下文寻找符合 'body' 定义的参数。
  2. 执行并解析：执行请求后，根据 'outputs' 定义的 selector 提取数据。
  3. 广播资产：将提取到的数据以 'name' 为键，附带其 'description' 存入全局黑板（Blackboard），供后续模块搜索。
